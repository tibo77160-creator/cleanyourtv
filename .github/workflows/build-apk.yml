{
  "name": "Compiler l'APK",
  "on": {
    "workflow_dispatch": {},
    "push": {
      "paths": [
        ".github/workflows/build-apk.yml"
      ]
    }
  },
  "jobs": {
    "build": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "uses": "actions/setup-java@v4",
          "with": {
            "distribution": "temurin",
            "java-version": "17"
          }
        },
        {
          "name": "Compiler",
          "working-directory": "launcher",
          "run": "chmod +x gradlew && ./gradlew assembleRelease --no-daemon --console=plain"
        },
        {
          "name": "Verifier",
          "working-directory": "launcher/app/build/outputs/apk/release",
          "run": "BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1); $BT/aapt2 dump badging app-release.apk | head -5; $BT/apksigner verify --print-certs app-release.apk | head -3; sha256sum app-release.apk; ls -la"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "tvhome-apk",
            "path": "launcher/app/build/outputs/apk/release/app-release.apk"
          }
        }
      ]
    }
  }
}
